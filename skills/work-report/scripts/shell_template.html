<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#2c2a26; --muted:#6f685c;
    --terra:#b8502c; --terra-soft:#c9714e; --line:#e3dccc; --good:#3f7d54; --bad:#b03a2e;
    --warn:#b8862c; --code:#efe8d8; --slate:#5e7287; --olive:#6b7a4f;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.82;font-size:17.5px}
  .wrap{max-width:1280px;margin:0 auto;padding:52px 52px 130px}
  @media(min-width:1341px){body{padding-left:272px}}
  #prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--terra),var(--terra-soft));z-index:400;transition:width .1s}
  .side-toc{position:fixed;left:0;top:0;width:256px;height:100vh;overflow-y:auto;
    border-right:1px solid var(--line);background:#f1ebdd;
    padding:46px 14px 50px 22px;font-size:13px;scrollbar-width:thin}
  .side-toc::-webkit-scrollbar{width:6px}
  .side-toc::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .side-toc .tt{font-family:Georgia,"Songti SC",serif;color:var(--terra);font-size:12px;
    font-weight:700;letter-spacing:2px;padding:0 9px 8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .side-toc .pt{font-family:Georgia,"Songti SC",serif;color:#8a8170;font-size:10.5px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;padding:12px 9px 3px}
  .side-toc a{display:block;color:var(--muted);padding:4.5px 9px;margin:1px 0;border-radius:6px;
    text-decoration:none;border-left:2px solid transparent;transition:all .15s;line-height:1.35}
  .side-toc a:hover{background:var(--card);color:var(--terra)}
  .side-toc a.active{color:var(--terra);border-left-color:var(--terra);background:var(--card);font-weight:600}
  @media(max-width:1340px){.side-toc{display:none}body{padding-left:0}}
  h1,h2,h3,h4{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;color:var(--terra);line-height:1.3}
  h1{font-size:39px;margin:0 0 10px;letter-spacing:.5px}
  h2{font-size:27px;margin:68px 0 18px;padding-bottom:10px;border-bottom:2px solid var(--line);scroll-margin-top:16px}
  h2 .num{display:inline-block;font-size:17px;color:#fff;background:var(--terra);border-radius:7px;
    padding:2px 11px;margin-right:12px;vertical-align:middle;font-family:Georgia,serif}
  h3{font-size:21px;color:var(--terra-soft);margin:34px 0 10px;scroll-margin-top:16px}
  h4{font-size:17px;color:#7a5a44;margin:18px 0 6px}
  .sub{color:var(--muted);font-size:16.5px;margin-bottom:16px;line-height:1.78}
  p{margin:11px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:17px 22px;margin:16px 0}
  .verdict{border-left:5px solid var(--terra);background:#fbf4ec}
  .verdict b{color:var(--terra)}
  .ok{border-left:5px solid var(--good);background:#f0f5f0}
  .warnc{border-left:5px solid var(--warn);background:#faf5e6}
  .lesson{border-left:5px solid var(--bad);background:#fbf0ee}
  .note{border-left:5px solid var(--slate);background:#eef2f4}
  table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
  th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#f0e9d8;color:#4a443a;font-weight:600}
  tr:nth-child(even) td{background:#fbf8f1}
  td code,th code{font-size:12.5px}
  code{background:var(--code);padding:1px 6px;border-radius:4px;font-size:13.8px;
    font-family:"SF Mono",Menlo,Consolas,monospace;color:#5a4632;overflow-wrap:break-word;word-break:break-word}
  pre{background:#2c2a26;color:#ece6d8;padding:16px 20px;border-radius:9px;overflow-x:auto;font-size:14px;line-height:1.66;
    font-family:"SF Mono",Menlo,Consolas,monospace;margin:14px 0}
  pre code{background:none;padding:0;color:inherit}
  .tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
  .t-ok{background:#e6f0e8;color:var(--good)}
  .t-bad{background:#f6e3e0;color:var(--bad)}
  .t-warn{background:#f6efdc;color:var(--warn)}
  .t-info{background:#e7eef2;color:var(--slate)}
  .muted{color:var(--muted);font-size:14px}
  .kpi{display:flex;gap:13px;flex-wrap:wrap;margin:16px 0}
  .kpi>div{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:13px 16px}
  .kpi .n{font-size:24px;font-weight:700;color:var(--terra);font-family:Georgia,serif;line-height:1.18}
  .kpi .l{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.48}
  .phase{list-style:none;padding:0;margin:14px 0}
  .phase li{position:relative;padding:13px 0 13px 50px;border-bottom:1px dashed var(--line)}
  .phase li .ph{position:absolute;left:0;top:12px;width:32px;height:32px;background:var(--terra);color:#fff;
    border-radius:50%;text-align:center;line-height:32px;font-weight:700;font-size:13px;font-family:Georgia,serif}
  .phase li.done .ph{background:var(--good)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
  .chip{font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;color:#4a443a}
  .chip b{color:var(--terra)}
  figure.diagram{margin:20px 0}
  figure.diagram .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fdfcf9}
  figure.diagram svg{min-width:700px;width:100%;height:auto;display:block}
  figcaption{font-size:14px;color:var(--muted);margin-top:11px;line-height:1.72}
  .zoomable{position:relative;cursor:zoom-in;transition:box-shadow .2s}
  .zoomable:hover{box-shadow:0 0 0 2px var(--terra-soft)}
  .zoomable::after{content:"⤢ 点击放大";position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);
    background:rgba(250,249,245,.92);border:1px solid var(--line);padding:2px 9px;border-radius:20px;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .zoomable:hover::after{opacity:1}
  .imgwrap{display:inline-block;max-width:100%;line-height:0}
  figure.video{margin:20px 0}
  figure.video video{display:block;width:100%;max-height:78vh;background:#000;border:1px solid var(--line);border-radius:12px;object-fit:contain}
  #lb{position:fixed;inset:0;z-index:300;display:none;background:rgba(33,32,28,.93)}
  #lb.open{display:block;animation:lbIn .2s ease}
  @keyframes lbIn{from{opacity:0}to{opacity:1}}
  #lb .lb-tools{position:fixed;top:16px;right:20px;z-index:2;display:flex;gap:8px;align-items:center}
  #lb .lb-tools button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(250,249,245,.25);
    background:rgba(250,249,245,.1);color:#faf9f5;font-size:17px;cursor:pointer;line-height:1;transition:background .15s}
  #lb .lb-tools button:hover{background:rgba(250,249,245,.22)}
  #lb .lb-tools .pct{color:rgba(250,249,245,.75);font-family:"SF Mono",Menlo,monospace;font-size:12.5px;min-width:46px;text-align:center}
  #lb .lb-hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(250,249,245,.55);font-size:12.5px;z-index:2;pointer-events:none}
  #lb .lb-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 36px 60px;overflow:hidden}
  #lb .lb-stage{transform-origin:center center;background:var(--bg);border-radius:14px;padding:24px 28px;max-width:100%}
  #lb .lb-stage svg{display:block;max-width:100%;height:auto}
  #lb .lb-stage img{display:block;max-width:100%;max-height:calc(100vh - 180px);width:auto;height:auto}
  details{background:var(--card);border:1px solid var(--line);border-radius:9px;margin:13px 0;padding:0 18px}
  details summary{cursor:pointer;padding:13px 0;font-weight:600;color:var(--terra-soft);list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ ";color:var(--terra)}
  details[open] summary::before{content:"▾ "}
  details[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  details .dbody{padding-bottom:14px}
  .footer{margin-top:64px;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line);padding-top:20px;line-height:1.8}
  .backtop{position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:50%;background:var(--terra);
    color:#fff;border:0;font-size:18px;cursor:pointer;opacity:0;transition:opacity .2s;z-index:200;box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .backtop.show{opacity:.9}
</style>
</head>
<body>
<div id="prog"></div>

<nav class="side-toc" id="sidetoc">
  <div class="tt">{{TOCTITLE}}</div>
{{TOC}}
</nav>

<div class="wrap" id="top">

{{CONTENT}}

</div>

<button class="backtop" id="backtop" title="回到顶部">↑</button>
<script>
const prog = document.getElementById('prog');
const backtop = document.getElementById('backtop');
function onScroll(){
  const h = document.documentElement;
  const sc = h.scrollTop, max = h.scrollHeight - h.clientHeight;
  prog.style.width = (max>0 ? (sc/max*100) : 0) + '%';
  backtop.classList.toggle('show', sc > 600);
}
addEventListener('scroll', onScroll, {passive:true}); onScroll();
backtop.addEventListener('click', ()=>scrollTo({top:0,behavior:'smooth'}));

const tocLinks = [...document.querySelectorAll('.side-toc a')];
const secs = tocLinks.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
function spy(){
  let cur = secs[0];
  for (const s of secs){ if (s.getBoundingClientRect().top <= 130) cur = s; }
  if(!cur) return;
  tocLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + cur.id));
}
addEventListener('scroll', spy, {passive:true}); spy();

const lb = document.createElement('div');
lb.id = 'lb';
lb.innerHTML = `
  <div class="lb-tools">
    <button data-act="minus" title="缩小">−</button>
    <span class="pct">100%</span>
    <button data-act="plus" title="放大">＋</button>
    <button data-act="reset" title="还原">⟳</button>
    <button data-act="close" title="关闭 (Esc)">✕</button>
  </div>
  <div class="lb-wrap"><div class="lb-stage"></div></div>
  <div class="lb-hint">滚轮缩放 · 点空白处或 Esc 关闭</div>`;
document.body.appendChild(lb);
const lbWrap = lb.querySelector('.lb-wrap');
const lbStage = lb.querySelector('.lb-stage');
const lbPct = lb.querySelector('.pct');
let zoom = 1;
function applyZoom(){ lbStage.style.transform = 'scale(' + zoom + ')'; lbPct.textContent = Math.round(zoom*100) + '%'; }
function openLB(node){
  lbStage.innerHTML = '';
  const clone = node.cloneNode(true);
  clone.classList.remove('zoomable');
  const svg = clone.tagName.toLowerCase() === 'svg' ? clone : clone.querySelector('svg');
  if (svg){ const w = Math.min(window.innerWidth - 140, 1600); svg.style.width = w + 'px'; svg.style.minWidth = '0'; }
  if (clone.tagName.toLowerCase() === 'img'){ clone.style.width = 'auto'; clone.style.height = 'auto';
    clone.style.maxWidth = Math.min(window.innerWidth - 140, 1600) + 'px'; }
  lbStage.appendChild(clone);
  zoom = 1; lb.classList.add('open'); document.body.style.overflow = 'hidden'; applyZoom();
}
function closeLB(){ lb.classList.remove('open'); document.body.style.overflow = ''; }
function setZoom(z){ zoom = Math.min(3, Math.max(0.5, z)); applyZoom(); }
lb.querySelector('.lb-tools').addEventListener('click', e => {
  const act = e.target.dataset && e.target.dataset.act;
  if (act === 'plus')  setZoom(zoom * 1.25);
  if (act === 'minus') setZoom(zoom / 1.25);
  if (act === 'reset') setZoom(1);
  if (act === 'close') closeLB();
});
lbWrap.addEventListener('click', e => { if (e.target === lbWrap) closeLB(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('open')) closeLB(); });
lb.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.12 : 1/1.12)); }, {passive:false});
document.querySelectorAll('figure.diagram .scroll').forEach(el => {
  el.classList.add('zoomable');
  el.addEventListener('click', () => openLB(el));
});
// 内嵌视频：base64 放在 type 为 application/octet-stream 的 script 数据块里，接近视口时转成 Blob 地址交给视频元素
// （大段 data: URI 视频在 Safari 上不稳；Blob 地址各浏览器都能拖动进度、全屏）。片段由 scripts/embed_video.py 生成
function hydrateVideo(v){
  if (v.dataset.ready) return;
  const s = document.getElementById(v.dataset.src);
  if (!s) return;
  v.dataset.ready = '1';
  const bin = atob(s.textContent.replace(/\s+/g, ''));
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  v.src = URL.createObjectURL(new Blob([buf], {type: s.dataset.mime || 'video/mp4'}));
}
const vids = [...document.querySelectorAll('video[data-src]')];
if ('IntersectionObserver' in window){
  const vio = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ hydrateVideo(e.target); vio.unobserve(e.target); }
  }), {rootMargin: '600px 0px'});
  vids.forEach(v => vio.observe(v));
} else vids.forEach(hydrateVideo);
document.querySelectorAll('.wrap img').forEach(img => {
  if (img.closest('a') || img.closest('figure.diagram')) return;
  const w = document.createElement('span');
  w.className = 'zoomable imgwrap';
  img.parentNode.insertBefore(w, img);
  w.appendChild(img);
  w.addEventListener('click', () => openLB(img));
});
</script>
</body>
</html>
